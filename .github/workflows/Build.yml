name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          if [ ! -f resources/icon.png ]; then
            echo "No icon provided, creating placeholder..."
            curl -s https://placehold.co -o resources/icon.png
          fi
          echo '{"name":"nooryaqeen","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0","@capacitor/geolocation":"^6.0.0","@capacitor/local-notifications":"^6.1.0"},"devDependencies":{"@capacitor/assets":"^3.0.5"}}' > package.json
          echo '{"appId":"com.nooryaqeen.app","appName":"نور اليقين","webDir":"www"}' > capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: Generate Application Icons
        run: npx cap assets generate --android
      - name: Add permissions and background services
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><application|' android/app/src/main/AndroidManifest.xml
      - name: Configure Android Audio Channel for Background Adhan
        run: |
          if [ -f adhan.mp3 ]; then
            mkdir -p android/app/src/main/res/raw
            cp adhan.mp3 android/app/src/main/res/raw/adhan.mp3
            sed -i 's|<head>|<head><script>window.NATIVE_ADHAN=1</script>|' www/index.html
            
            MAIN_ACTIVITY="android/app/src/main/java/com/nooryaqeen/app/MainActivity.java"
            sed -i 's|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport android.media.AudioAttributes;\nimport android.net.Uri;|' $MAIN_ACTIVITY
            
            JAVA_CODE="  @Override\n  public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {\n      NotificationChannel channel = new NotificationChannel(\"adhan_channel\", \"Adhan Alerts\", NotificationManager.IMPORTANCE_HIGH);\n      channel.setDescription(\"Channel for Adhan Notifications\");\n      AudioAttributes att = new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();\n      channel.setSound(Uri.parse(\"android.resource://\" + getPackageName() + \"/raw/adhan\"), att);\n      NotificationManager manager = getSystemService(NotificationManager.class);\n      if (manager != null) { manager.createNotificationChannel(channel); }\n    }\n  }"
            sed -i "s|public class MainActivity extends BridgeActivity {}|public class MainActivity extends BridgeActivity {\n$JAVA_CODE\n}|" $MAIN_ACTIVITY
          else
            echo "Critical Error: adhan.mp3 not found in repository root!"
            exit 1
          fi
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nooryaqeen-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Noor Al-Yaqin ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
